name: siraj
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.16.0
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  adhan: ^2.0.0+1
  http: ^1.6.0
  audioplayers: ^6.8.1
  go_router: ^17.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  geolocator: ^14.0.3
  flutter_local_notifications: ^22.1.0
  font_awesome_flutter: ^11.0.0
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.2.4
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  url_launcher: ^6.3.2
  quran_library: ^4.2.1
  timezone: ^0.11.1
  share_plus: ^13.2.0
  sentry_flutter: ^9.14.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/data/
    - assets/images/
    - assets/audio/adhan/

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: UthmanTNB
      fonts:
        - asset: assets/fonts/UthmanTNB_v2-0.ttf
    - family: HafsSmart
      fonts:
        - asset: assets/fonts/HafsSmart_08.ttf
    - family: QuranFont
      fonts:
        - asset: assets/fonts/QuranFont.ttf