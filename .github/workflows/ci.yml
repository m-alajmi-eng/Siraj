name: CI - Analyze & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze code (fail only on real errors)
        run: |
          set +e
          OUTPUT=$(flutter analyze 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "error •"; then
            echo "Real errors found - failing build"
            exit 1
          fi
          echo "No real errors - success (warnings/info are acceptable)"
          exit 0

      - name: Run tests
        run: flutter test
