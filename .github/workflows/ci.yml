name: CI - Analyze & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # رقم مثبَّت صراحة (لا channel: 'stable') - تحديث تلقائي غير
          # مقصود لقناة stable (3.47.0→3.47.2) سبَّب فشل بناء حقيقي
          # 2026-09-08 (راجع تعليق android/app/build.gradle.kts). هذا
          # الرقم مطابق تماماً لنسخة التطوير المحلية المُختبَرة فعلياً
          # (flutter analyze/test/build) طوال هذا المشروع.
          flutter-version: '3.44.2'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze code (fail only on real errors)
        run: |
          set +e
          OUTPUT=$(flutter analyze 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "error •"; then
            echo "Real errors found - failing build"
            exit 1
          fi
          echo "No real errors - success (warnings/info are acceptable)"
          exit 0

      - name: Run tests
        run: flutter test

      # ⚠️ 2026-09-08: بناء/توقيع/رفع الإصدار كان يعمل تلقائياً على *كل* push
      # (حتى دفعات docs فقط لا تمس أي كود) - هذا هو السبب الجذري الفعلي لفشل
      # CI بالكامل بمدة 0 ثانية وصفر job منذ 2026-08-18: مستودع خاص على خطة
      # مجانية (حد تخزين 500MB لمرفقات Actions) تراكم لديه 35 مرفق APK قديمة
      # (~4.2GB، أكثر من 8 أضعاف الحد) من طفرة رفع واحدة بتاريخ 2026-07-17،
      # فرفض GitHub استحداث أي job جديد إطلاقاً حتى تحرير المساحة (رسالة الخطأ
      # الفعلية من سجل التشغيل الناجح الأخير 2026-08-14: "Failed to
      # CreateArtifact: Artifact storage quota has been hit"). حُذفت الـ35
      # مرفقاً القديمة يدوياً (`gh api -X DELETE .../actions/artifacts/{id}`)
      # لتحرير الحصة فوراً. **الإصلاح الجذري هنا**: فصل بناء/توقيع/رفع الإصدار
      # عن مسار push/PR الروتيني تماماً وحصره بتشغيل يدوي (workflow_dispatch)
      # فقط - فلا يستهلك أي push/PR مستقبلي (بما فيها آلاف دفعات docs(stories))
      # وقت بناء Gradle (~14 دقيقة) ولا مساحة تخزين المرفقات، ولا يفشل بسبب
      # غياب أسرار التوقيع (KEYSTORE_*) التي لم تُضَف بعد. مسار push/PR
      # الروتيني الآن يقتصر على analyze+test فقط (يطابق اسم الـjob نفسه
      # "Analyze & Test" حرفياً) - سريع (~1 دقيقة) ولا يعتمد على أي سر مفقود.
      #
      # يتطلب هذا القسم (عند تشغيله يدوياً) إضافة الأسرار التالية من قِبل مالك
      # المستودع في: Settings → Secrets and variables → Actions:
      #   KEYSTORE_BASE64          - محتوى ملف siraj-release.jks بصيغة base64
      #                              (يُنتَج محلياً بأمر: base64 -w0 siraj-release.jks)
      #   KEYSTORE_STORE_PASSWORD  - كلمة مرور الـkeystore
      #   KEYSTORE_KEY_PASSWORD    - كلمة مرور المفتاح
      #   KEYSTORE_KEY_ALIAS       - alias المفتاح (القيمة محلياً: siraj-release)
      # إلى أن تُضاف هذه الأسرار: لا يُنشأ android/key.properties هنا، فيبني Gradle
      # توقيعاً غير مكتمل حسب منطقه الحالي في build.gradle.kts، وخطوة "Verify release
      # signing" أدناه تُفشل صراحة بدل الصمت - سلوك مقصود لحين إضافة الأسرار
      # (لا يؤثر على push/PR الروتيني بعد الآن لأنه لا يُشغَّل إلا يدوياً).
      # ⚠️ ملاحظة: لا يمكن دمج `secrets.X` مع شروط أخرى (مثل github.event_name)
      # داخل `if:` لخطوة عندما يحوي الملف مُطلِق workflow_dispatch - يرفض GitHub
      # التحقق من صلاحية الطلب برسالة "Unrecognized named-value: 'secrets'"
      # (اكتُشف فعلياً أثناء اختبار هذا الإصلاح بمحاولة تشغيل يدوي عبر
      # `gh workflow run` - قيد توثيقي معروف بمنصة GitHub Actions: سياق secrets
      # غير متاح وقت التحقق من صحة طلبات workflow_dispatch قبل تنفيذها). لذلك
      # الشرط هنا مقتصر على github.event_name فقط، وفحص خُلوّ السر انتقل لداخل
      # سكربت bash نفسه (مكافئ سلوكياً تماماً - يخرج فوراً بلا إنشاء أي ملف إن
      # كان السر فارغاً).
      - name: Set up release signing config from GitHub secrets
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "لا سر KEYSTORE_BASE64 مُضاف - تخطي إنشاء android/key.properties."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/siraj-release.jks"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          storeFile=$KEYSTORE_PATH
          EOF

      - name: Build release APK
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: flutter build apk --release

      # يقارن بصمة الشهادة المُضمَّنة فعلياً في الـAPK الناتج ببصمة شهادة الإصدار في
      # الـkeystore نفسه (وليس مجرد التحقق من وجود أي توقيع) - لضمان أن الفشل يشمل أي
      # توقيع غير حقيقي (غياب الأسرار، توقيع debug افتراضي، أو keystore مختلف) لا فقط
      # "error •" في flutter analyze كما كان سابقاً.
      - name: Verify release signing
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -e
          APK="build/app/outputs/flutter-apk/app-release.apk"
          KEYSTORE_PATH="$RUNNER_TEMP/siraj-release.jks"
          ALIAS="${{ secrets.KEYSTORE_KEY_ALIAS }}"

          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ] || [ ! -f "$KEYSTORE_PATH" ]; then
            echo "فشل: أسرار التوقيع الإصداري (KEYSTORE_BASE64 وما يعادلها) غير مضافة بعد في إعدادات المستودع."
            echo "أضِف الأسرار الموثقة في تعليق خطوة 'Set up release signing config' أعلاه، ثم أعد تشغيل CI."
            exit 1
          fi

          APKSIGNER=$(command -v apksigner || find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "فشل: تعذّر إيجاد أداة apksigner على العامل - لا يمكن التحقق من التوقيع."
            exit 1
          fi

          EXPECTED_FP=$(keytool -list -v -keystore "$KEYSTORE_PATH" -alias "$ALIAS" -storepass "${{ secrets.KEYSTORE_STORE_PASSWORD }}" 2>/dev/null | awk -F'SHA256: ' '/SHA256:/ {print $2; exit}')
          ACTUAL_FP=$("$APKSIGNER" verify --print-certs "$APK" 2>/dev/null | awk -F': ' '/SHA-256 digest/ {print $2; exit}')

          if [ -z "$EXPECTED_FP" ] || [ -z "$ACTUAL_FP" ]; then
            echo "فشل: تعذّر استخراج بصمة الشهادة (من الـkeystore أو من الـAPK) - لا يمكن تأكيد التوقيع."
            exit 1
          fi

          if [ "$EXPECTED_FP" != "$ACTUAL_FP" ]; then
            echo "فشل: الـAPK غير موقَّع بمفتاح الإصدار (siraj-release) - قد يكون موقَّعاً بمفتاح debug أو keystore مختلف."
            exit 1
          fi

          echo "التحقق ناجح: الـAPK موقَّع فعلياً بمفتاح الإصدار الصحيح."

      - name: Upload APK artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
