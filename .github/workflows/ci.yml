name: CI - Analyze & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze code
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || true
          # نتحقق فقط من عدم وجود 'error' حقيقي، بنفس منهجنا المحلي طوال المشروع
          if flutter analyze 2>&1 | grep -q "error •"; then
            echo "توجد أخطاء حقيقية (error) - إيقاف"
            flutter analyze 2>&1 | grep "error •"
            exit 1
          fi
          echo "لا توجد أخطاء حقيقية - نجاح (تحذيرات/معلومات مقبولة)

      - name: Run tests
        run: flutter test
